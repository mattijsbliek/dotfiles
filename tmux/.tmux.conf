# Remap prefix from Ctrl+b to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support (click to select panes/windows, drag to resize, scroll)
set -g mouse on

# Status bar appearance
set -g status-position top
set -g status-style "bg=colour235,fg=colour250"
set -g status-justify left
set -g status-interval 5

# Left: session name, highlighted
set -g status-left-length 20
set -g status-left "#[bg=colour39,fg=colour232,bold] #S #[bg=colour235,fg=colour39]#[default] "

# Right: hostname
set -g status-right-length 40
set -g status-right "#[fg=colour245]#h "

# Window list
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=colour39,fg=colour232,bold] #I:#W#F #[bg=colour235,fg=colour39]#[default]"
set -g window-status-separator ""
